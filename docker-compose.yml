volumes:
  node_modules_volume:

services:
  app:
    build:
      context: .
    image: vue-vite-dev
    ports:
       - "3030:5173"
    working_dir: /src
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./:/src
      - node_modules_volume:/src/node_modules
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - NODE_OPTIONS=--max_old_space_size=8192